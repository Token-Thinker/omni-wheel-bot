name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          # Fail on any vulnerability severity.
          fail-on-severity: low
          # Deny OSI-incompatible licenses commonly found in supply chains.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
