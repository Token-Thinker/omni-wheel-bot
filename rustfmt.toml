# Comments
# Intentionally OFF: comments are hand-authored explanations aimed at readers of
# the published crate (crates.io). rustfmt must never re-wrap, normalize, or
# reformat them — only code layout is normalized. Do not flip these back on
# without a deliberate decision to let rustfmt reflow prose.
format_code_in_doc_comments = false
normalize_comments          = false
wrap_comments               = false

# Imports
reorder_imports     = true
imports_indent      = "Block"
group_imports       = "StdExternalCrate"
imports_granularity = "Crate"
imports_layout      = "HorizontalVertical"


# Enums
enum_discrim_align_threshold = 35


#Body
# SameLineWhere matches the actual hand-written style used across the entire
# codebase since init. The previous "AlwaysNextLine" never matched the code and
# only surfaced as whole-repo diffs once a newer nightly began honoring it.
brace_style = "SameLineWhere"
control_brace_style = "ClosingNextLine"
condense_wildcard_suffixes = true
fn_params_layout = "Vertical"
fn_single_line = true