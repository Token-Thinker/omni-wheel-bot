[workspace]
members = [
    "owb-core",
    "owb-msg",
    "owb-ui",
    "owb-bin/owb-esp",
    "owb-bin/owb-host-sim",
]

resolver = "2"

[profile.dev]
opt-level = "s"

[profile.test]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
overflow-checks = false
