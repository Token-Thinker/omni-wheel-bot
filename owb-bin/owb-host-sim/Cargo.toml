[package]
name = "owb-host-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
owb-core = { path = "../../owb-core", features = ["serde", "sim"] }
# owb-ui is WASM-only; the host-sim serves dist/ from disk via tower-http
# instead of embedding it at compile time.
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
