[package]
name = "owb-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Operator UI for Omni-Wheel Bot — Leptos/WASM PWA, served from bot on first connect then cached by service worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlSelectElement", "Storage", "WebSocket", "MessageEvent", "CloseEvent",
  "ErrorEvent", "PointerEvent", "EventTarget", "AddEventListenerOptions",
  "Performance", "History", "Location", "Url", "UrlSearchParams",
  "DomRect", "CssStyleDeclaration",
] }
js-sys = "0.3"
owb-msg = { path = "../owb-msg", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
gloo-timers = { version = "0.4", features = ["futures"] }
console_error_panic_hook = "0.1"
