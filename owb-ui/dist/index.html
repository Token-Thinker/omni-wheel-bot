<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OWB Controller</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="/style.css" integrity="sha384-jxWw6+fT44dvxUGtK1pzjMFh/nctAEx/9Q6FUUW1y4PwKEAdgBnDSpZMh9oLRdDG"/>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- copy-file/copy-dir: trunk copies these to dist/ at build time so
         owb-esp/ui_assets.rs can embed them with include_bytes!. -->
    
    
  <link rel="modulepreload" href="/app.js" crossorigin="anonymous" integrity="sha384-6eYglBU075/8rWKs9heXGd4jFzsP93pvrHD9zBuV2RuDWg1KIGlGOcyAMhhBHoBM"><link rel="preload" href="/app.wasm" crossorigin="anonymous" integrity="sha384-EiUIUIqwBuAfYYL61gVGQap+Z5hDXpWZpy1nTi3CFxZ61qS0VNoCv1RQ7OjBM9Qy" as="fetch" type="application/wasm"></head>
  <body data-theme="dark" data-ui-variant="v1-alpha">
    <!-- Leptos mounts here -->
  
<script type="module">
import init, * as bindings from '/app.js';
const wasm = await init({ module_or_path: '/app.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
