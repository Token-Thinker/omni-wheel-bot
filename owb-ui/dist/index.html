<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OWB Controller</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="/style.css" integrity="sha384-jkgSBuqJ9k+zD04BGGviAEp8fXNF1tRLa8HcNC6Hb451KqrTs3I0FCLRnTcFT6/1"/>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- copy-file/copy-dir: trunk copies these to dist/ at build time so
         owb-esp/ui_assets.rs can embed them with include_bytes!. -->
    
    
  <link rel="modulepreload" href="/app.js" crossorigin="anonymous" integrity="sha384-snCttjZz+bIqY0Y9ak1hGesztqTnzD1YR3XUCusxJhWb2jKoedUfkcd9pcQFbmJH"><link rel="preload" href="/app.wasm" crossorigin="anonymous" integrity="sha384-wmBRUyr1M9UPp1kHMdCrUzZ7jZ3OwBmgnIGP50mo9C0Qfx82GgG5k8WpfiqVtr5I" as="fetch" type="application/wasm"></head>
  <body data-theme="dark" data-ui-variant="v1-alpha">
    <!-- Leptos mounts here -->
  
<script type="module">
import init, * as bindings from '/app.js';
const wasm = await init({ module_or_path: '/app.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
